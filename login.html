<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mag-login - Ebook Blueprint Generator</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap');

:root{
  --bg:#0E2A47;
  --grid:rgba(111,195,214,0.09);
  --grid-strong:rgba(111,195,214,0.16);
  --paper:#F5F1E6;
  --ink:#16233A;
  --ink-soft:#4A5A72;
  --amber:#E8A33D;
  --amber-dark:#C97F1F;
  --cyan:#6FC3D6;
  --rule:#D8CFAE;
  --err:#C1502E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);}
body{
  background:
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
    radial-gradient(circle at 15% 10%, rgba(111,195,214,0.10), transparent 45%),
    var(--bg);
  font-family:'Space Grotesk', sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.lg-wrap{width:100%;max-width:400px;}
.lg-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.18em;color:var(--cyan);
  text-transform:uppercase;text-align:center;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.lg-eyebrow::before,.lg-eyebrow::after{content:'';width:22px;height:1px;background:var(--cyan);}
.lg-title{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;
  color:var(--paper);text-align:center;margin:0 0 26px;
}
.lg-title span{color:var(--amber);}
.lg-sheet{
  background:var(--paper);color:var(--ink);border-radius:3px;
  padding:32px 30px;position:relative;font-family:'Source Serif 4',serif;
}
.lg-sheet::before,.lg-sheet::after,.lg-sheet .c3,.lg-sheet .c4{
  content:'';position:absolute;width:16px;height:16px;border-color:var(--amber-dark);
}
.lg-sheet::before{top:8px;left:8px;border-top:2px solid;border-left:2px solid;}
.lg-sheet::after{top:8px;right:8px;border-top:2px solid;border-right:2px solid;}
.lg-sheet .c3{bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid;}
.lg-sheet .c4{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid;}
.lg-step-label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber-dark);margin-bottom:6px;
}
.lg-h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin:0 0 20px;color:var(--ink);}
.lg-field{margin-bottom:18px;}
.lg-field label{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;
}
.lg-field input{
  width:100%;border:none;border-bottom:2px dashed var(--rule);
  background:transparent;font-family:'Source Serif 4',serif;font-size:16.5px;
  color:var(--ink);padding:6px 2px 8px;outline:none;transition:border-color .2s;
}
.lg-field input:focus{border-color:var(--amber-dark);}
.lg-btn{
  width:100%;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;
  background:var(--amber);color:var(--ink);border:none;
  padding:13px 22px;border-radius:2px;cursor:pointer;margin-top:6px;
  transition:transform .15s, background .15s;
}
.lg-btn:hover{background:var(--amber-dark);transform:translateY(-1px);}
.lg-btn:disabled{opacity:.6;cursor:default;transform:none;}
.lg-error{
  background:rgba(193,80,46,0.1);border:1px solid var(--err);color:var(--err);
  padding:11px 13px;border-radius:3px;font-size:13px;margin-bottom:16px;
  font-family:'IBM Plex Mono',monospace;line-height:1.6;display:none;
}
.lg-error.show{display:block;}
.lg-footer{
  margin-top:22px;text-align:center;color:#5E7793;font-size:11.5px;
  font-family:'IBM Plex Mono',monospace;
}
</style>
</head>
<body>

<div class="lg-wrap">
  <div class="lg-eyebrow">Ebook Blueprint Generator</div>
  <h1 class="lg-title">Mag-<span>login</span> muna</h1>

  <div class="lg-sheet">
    <div class="c3"></div><div class="c4"></div>
    <div class="lg-step-label">Access Gate</div>
    <h2 class="lg-h2">Ilagay ang iyong credentials</h2>

    <div class="lg-error" id="lg-error"></div>

    <form id="lg-form">
      <div class="lg-field">
        <label>Email</label>
        <input id="lg-email" type="email" autocomplete="username" required/>
      </div>
      <div class="lg-field">
        <label>Password</label>
        <input id="lg-password" type="password" autocomplete="current-password" required/>
      </div>
      <button class="lg-btn" id="lg-submit" type="submit">Mag-login</button>
    </form>
  </div>

  <div class="lg-footer">EBOOK BLUEPRINT - ACCESS GATE - GENERATED WITH CLAUDE</div>
</div>

<script src="supabase-config.js"></script>
<script>
(function(){
  const form = document.getElementById('lg-form');
  const errorBox = document.getElementById('lg-error');
  const submitBtn = document.getElementById('lg-submit');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError(){
    errorBox.classList.remove('show');
  }

  // Kung may existing session na, deretso sa index.html.
  (async function checkExistingSession(){
    try{
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(session){
        window.location.href = "index.html";
      }
    }catch(e){
      // Kung hindi pa naka-configure ang supabase-config.js, huwag i-block ang login form.
      console.error('Hindi ma-check ang session:', e);
    }
  })();

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    hideError();
    const email = document.getElementById('lg-email').value.trim();
    const password = document.getElementById('lg-password').value;
    if(!email || !password){
      showError('Kailangan ng email at password.');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Ni-verify...';
    try{
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error){
        showError(error.message || 'Mali ang email o password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Mag-login';
        return;
      }
      window.location.href = "index.html";
    }catch(err){
      showError('Hindi maabot ang authentication server: ' + err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Mag-login';
    }
  });
})();
</script>
</body>
</html>
